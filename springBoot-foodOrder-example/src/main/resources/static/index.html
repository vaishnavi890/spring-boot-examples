<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Food Order App</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1>🍕 Food Menu</h1>

<a href="/food/add">➕ Add Food</a> |
<a href="/order/new">🛒 Place Order</a> |
<a href="/orders">📜 View Orders</a>

<hr>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Category</th>
    </tr>
    <tr th:each="food : ${foodItems}">
        <td th:text="${food.id}"></td>
        <td th:text="${food.name}"></td>
        <td th:text="${food.price}"></td>
        <td th:text="${food.category}"></td>
    </tr>
</table>
</body>
</html>
